name: Deploy a producción

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar archivos estáticos al directorio servido por Nginx
        run: |
          DEST="$HOME/sites/examenbrevete"
          mkdir -p "$DEST"
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'deploy' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'test-results' \
            --exclude 'playwright-report' \
            --exclude 'playwright.config.js' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            ./ "$DEST/"
